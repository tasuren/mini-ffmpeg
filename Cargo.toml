[workspace]
resolver = "3"
members = ["mini-ffmpeg", "mini-ffmpeg-sys", "remux-spike", "xtask"]

# xtask is a development-only command, so exclude it from plain `cargo build`
# and `cargo run`. Run it with `cargo xtask <task>` and test it with
# `cargo test -p xtask`.
#
# remux-spike is a temporary crate for checking that the translated FFmpeg
# actually works. It is also excluded.
default-members = ["mini-ffmpeg", "mini-ffmpeg-sys"]

[workspace.package]
license = "LGPL-2.1-or-later"
