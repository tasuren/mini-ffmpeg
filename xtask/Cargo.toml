[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
# Used to read `cinrs_manifest.toml`. Writing only requires building strings,
# so only the features needed for reading are enabled.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
