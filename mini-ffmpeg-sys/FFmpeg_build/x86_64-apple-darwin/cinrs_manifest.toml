# Generated by `cargo xtask ffmpeg-manifest`. Do not edit manually.
# To change the configuration, update CONFIGURE_ARGS in xtask and regenerate.

[ffmpeg]
version = "n9.0.2"
configure_args = [
    "--disable-all",
    "--disable-autodetect",
    "--enable-avcodec",
    "--enable-avformat",
    "--disable-asm",
    "--disable-inline-asm",
    "--disable-network",
    "--disable-pthreads",
    "--enable-demuxer=wav",
    "--enable-muxer=wav",
    "--enable-protocol=file,pipe",
]

# The target of this configuration. Files in the same directory were generated
# on a machine for this target. The build script checks that this matches
# the build target (`TARGET`).
[target]
triple = "x86_64-apple-darwin"

# Compile options shared by all translation units.
[compile]
std = "c17"
defines = [
    "_ISOC11_SOURCE",
    "_FILE_OFFSET_BITS=64",
    "_LARGEFILE_SOURCE",
    "PIC",
    "HAVE_AV_CONFIG_H",
]

# In search order, relative to the `mini-ffmpeg-sys` root; usable directly in
# `#pragma cinrs include_path`.
include_dirs = [
    "FFmpeg_build/x86_64-apple-darwin",
    "FFmpeg",
    "FFmpeg/compat/dispatch_semaphore",
    "FFmpeg/compat/stdbit",
]

[sources]
