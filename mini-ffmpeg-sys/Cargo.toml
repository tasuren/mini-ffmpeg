[package]
name = "mini-ffmpeg-sys"
version = "0.1.0"
edition = "2024"
# Licenses present in the FFmpeg code used by this crate.
# See `README.md` for details.
license = "LGPL-2.1-or-later AND BSD-3-Clause AND BSL-1.0 AND IJG AND ISC AND MIT AND Zlib"
readme = "README.md"
# Include FFmpeg source, generated files, and licenses in the crate package.
# The build script translates FFmpeg source to Rust, so building requires the source.
include = ["Cargo.toml", "build.rs", "build/**", "src/**", "tests/**", "FFmpeg/**", "FFmpeg_build/**", "LICENSE.ffmpeg", "README.md"]

publish = false # Development is ongoing and some items still need verification.

# No runtime dependencies. Only the build script uses cinrs to translate C to Rust.
[dependencies]

[build-dependencies]
# C-to-Rust translator used internally by cinrs macros (such as `c17!`), called
# directly by the build script. Requires 0.3.0 or later for `Options::reachable_only`,
# which emits only items used by a translation unit.
#
# Pin with `=`: cinrs-core is an internal cinrs crate whose output and API can
# change between versions. When updating, run `cargo test --workspace` and inspect
# changes to the translated code in `OUT_DIR`.
cinrs-core = "=0.3.0"

# Write translated code (token streams) returned by cinrs-core to files.
# cinrs-core already depends on this crate, so it adds no new dependency.
proc-macro2 = "1"

# Read build manifests (`FFmpeg_build/<target>/cinrs_manifest.toml`).
# Enable only the features needed for reading.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
# Exercise the build-time validation and filtering against cinrs tokens.
cinrs-core = "=0.3.0"
proc-macro2 = "1"
