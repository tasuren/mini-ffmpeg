[package]
name = "mini-ffmpeg-sys"
version = "0.1.0"
edition = "2024"
# FFmpegの使うコードに含まれるライセンスを列挙している。
# 詳細は `README.md` が参考になる。
license = "LGPL-2.1-or-later AND BSD-3-Clause AND BSL-1.0 AND IJG AND ISC AND MIT AND Zlib"
readme = "README.md"
# FFmpeg のソースと生成物、ライセンスをクレートの配布にも含める。ビルドスクリプトが
# FFmpeg のソースを読んで Rust に変換するので、ソースが無いとビルドできない。
include = ["Cargo.toml", "build.rs", "build/**", "src/**", "tests/**", "cinrs_manifest.toml", "FFmpeg/**", "FFmpeg_generated/**", "LICENSE.ffmpeg", "README.md"]

publish = false # まだ開発が終わっておらず確認したい項目がまだ残っている。

# 実行時の依存は無い。cinrs は、ビルドスクリプトが C を Rust に変換するときにだけ使う。
[dependencies]

[build-dependencies]
# C を Rust に変換する本体。cinrs のマクロ（`c17!` など）が内部で使っているもので、
# ビルドスクリプトがこれを直接呼ぶ。
#
# crates.io の 0.2.0 には、翻訳単位が使う項目だけを出力する指定
# （`Options::reachable_only`）が無いので、Git のコミットを固定して使う。
# 上流（tanakh/cinrs）の master に、Mach-O での `__asm` のラベルの修正を足した
# fork のコミット。修正が上流に入ったら、上流のコミットに切り替える。
#
# crates.io は Git の依存を受け付けない。このクレートを公開できるのは、上の 2 つを
# 含む cinrs-core が crates.io に公開されてから。
cinrs-core = { git = "https://github.com/tasuren/cinrs", rev = "bb33d7acff45656b16f3346cb53aa9235dc8d350" }

# cinrs-core が返す変換後のコード（トークンの並び）を、ファイルに書き出すために使う。
# cinrs-core 自身が依存しているクレートで、依存の数は増えない。
proc-macro2 = "1"

# `cinrs_manifest.toml` の読み取り用。読み取りに要る機能だけを有効にしている。
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
