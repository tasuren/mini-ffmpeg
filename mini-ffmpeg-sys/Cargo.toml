[package]
name = "mini-ffmpeg-sys"
version = "0.1.0"
edition = "2024"
# FFmpegの使うコードに含まれるライセンスを列挙している。
# 詳細は `README.md` が参考になる。
license = "LGPL-2.1-or-later AND BSD-3-Clause AND BSL-1.0 AND IJG AND ISC AND MIT AND Zlib"
readme = "README.md"
# FFmpeg のソースと生成物、ライセンスをクレートの配布にも含める。ビルドスクリプトが
# FFmpeg のソースを読んで Rust に変換するので、ソースが無いとビルドできない。
include = ["Cargo.toml", "build.rs", "build/**", "src/**", "tests/**", "FFmpeg/**", "FFmpeg_build/**", "LICENSE.ffmpeg", "README.md"]

publish = false # まだ開発が終わっておらず確認したい項目がまだ残っている。

# 実行時の依存は無い。cinrs は、ビルドスクリプトが C を Rust に変換するときにだけ使う。
[dependencies]

[build-dependencies]
# C を Rust に変換する本体。cinrs のマクロ（`c17!` など）が内部で使っているもので、
# ビルドスクリプトがこれを直接呼ぶ。翻訳単位が使う項目だけを出力する指定
# （`Options::reachable_only`）が 0.3.0 で入ったので、それ以降が要る。
#
# バージョンは `=` で固定する。cinrs-core は cinrs の内部のクレートで、変換の結果や
# API がバージョンで変わりうる。上げるときは、`cargo test --workspace` に加えて、
# 変換後のコード（`OUT_DIR` の中）がどう変わったかも見る。
cinrs-core = "=0.3.0"

# cinrs-core が返す変換後のコード（トークンの並び）を、ファイルに書き出すために使う。
# cinrs-core 自身が依存しているクレートで、依存の数は増えない。
proc-macro2 = "1"

# ビルドマニフェスト（`FFmpeg_build/<ターゲット>/cinrs_manifest.toml`）の読み取り用。読み取りに要る機能だけを有効にしている。
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
# Exercise the build-time validation and filtering against cinrs tokens.
cinrs-core = "=0.3.0"
proc-macro2 = "1"
